</div>

<script>

    // =========================================
    // GEGEVENS UIT LEDENPAGINA
    // =========================================

    let leden =
        JSON.parse(
            localStorage.getItem("leden")
        ) || [];


    // =========================================
    // START
    // =========================================

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            verwerkPagina();

        }
    );


    // =========================================
    // PAGINA VERWERKEN
    // =========================================

    function verwerkPagina() {

        // opnieuw ophalen zodat eventuele
        // wijzigingen direct beschikbaar zijn
        leden =
            JSON.parse(
                localStorage.getItem("leden")
            ) || [];


        updateStatistieken();

        toonVandaag();

        toonVolgendeVerjaardag();

        toonVerjaardagen();

    }


    // =========================================
    // ALLE LEDEN MET GEBOORTEDATUM
    // =========================================

    function verjaardagsLijst() {

        return leden
            .filter(
                function(lid) {

                    return (
                        lid.geboorteHond &&
                        geldigeDatum(
                            lid.geboorteHond
                        )
                    );

                }
            )
            .map(
                function(lid) {

                    return {
                        lid: lid,
                        datum: nieuweVerjaardagDatum(
                            lid.geboorteHond
                        )
                    };

                }
            );
    }


    // =========================================
    // VERJAARDAGSDATUM VAN DIT JAAR
    // =========================================

    function nieuweVerjaardagDatum(
        geboortedatum
    ) {

        const geboorte =
            new Date(
                geboortedatum + "T00:00:00"
            );


        const vandaag =
            new Date();


        return new Date(
            vandaag.getFullYear(),
            geboorte.getMonth(),
            geboorte.getDate()
        );
    }


    // =========================================
    // VANDAAG JARIG
    // =========================================

    function isVandaag(
        datum
    ) {

        const vandaag =
            new Date();


        return (
            datum.getDate() ===
            vandaag.getDate()
            &&
            datum.getMonth() ===
            vandaag.getMonth()
        );
    }


    // =========================================
    // DAGEN TOT VERJAARDAG
    // =========================================

    function dagenTot(
        datum
    ) {

        const vandaag =
            new Date();


        const start =
            new Date(
                vandaag.getFullYear(),
                vandaag.getMonth(),
                vandaag.getDate()
            );


        let verjaardag =
            new Date(
                vandaag.getFullYear(),
                datum.getMonth(),
                datum.getDate()
            );


        if (
            verjaardag < start
        ) {

            verjaardag =
                new Date(
                    vandaag.getFullYear() + 1,
                    datum.getMonth(),
                    datum.getDate()
                );
        }


        const verschil =
            verjaardag.getTime() -
            start.getTime();


        return Math.round(
            verschil /
            (
                1000 *
                60 *
                60 *
                24
            )
        );
    }


    // =========================================
    // LEEFTIJD BEREKENEN
    // =========================================

    function berekenLeeftijd(
        geboortedatum
    ) {

        if (!geboortedatum) {
            return "";
        }


        const geboorte =
            new Date(
                geboortedatum + "T00:00:00"
            );


        const vandaag =
            new Date();


        let leeftijd =
            vandaag.getFullYear() -
            geboorte.getFullYear();


        const verjaardagDitJaar =
            new Date(
                vandaag.getFullYear(),
                geboorte.getMonth(),
                geboorte.getDate()
            );


        if (
            verjaardagDitJaar > vandaag
        ) {

            leeftijd--;

        }


        return leeftijd;
    }


    // =========================================
    // STATISTIEKEN
    // =========================================

    function updateStatistieken() {

        const verjaardagen =
            verjaardagsLijst();


        document.getElementById(
            "aantalVerjaardagen"
        ).innerText =
            verjaardagen.length;


        const maand =
            new Date().getMonth();


        const dezeMaand =
            verjaardagen.filter(
                function(item) {

                    return (
                        item.datum.getMonth() ===
                        maand
                    );

                }
            ).length;


        document.getElementById(
            "dezeMaand"
        ).innerText =
            dezeMaand;


        document.getElementById(
            "metGeboortedatum"
        ).innerText =
            verjaardagen.length;
    }


    // =========================================
    // VANDAAG TONEN
    // =========================================

    function toonVandaag() {

        const verjaardagen =
            verjaardagsLijst();


        const jarigen =
            verjaardagen.filter(
                function(item) {

                    return isVandaag(
                        item.datum
                    );

                }
            );


        const vak =
            document.getElementById(
                "vandaag"
            );


        const titel =
            document.getElementById(
                "vandaagTitel"
            );


        const tekst =
            document.getElementById(
                "vandaagTekst"
            );


        if (jarigen.length === 0) {

            vak.classList.remove(
                "jarig"
            );


            titel.innerText =
                "Geen verjaardag vandaag";


            tekst.innerText =
                "Vandaag is er geen hond jarig.";

            return;
        }


        vak.classList.add(
            "jarig"
        );


        titel.innerText =
            "🎉 Vandaag jarig!";


        const namen =
            jarigen.map(
                function(item) {

                    return (
                        item.lid.naamHond ||
                        "Onbekende hond"
                    );

                }
            );


        tekst.innerText =
            namen.join(
                ", "
            ) +
            (
                namen.length === 1
                ? " is vandaag jarig!"
                : " zijn vandaag jarig!"
            );
    }


    // =========================================
    // VOLGENDE VERJAARDAG
    // =========================================

    function toonVolgendeVerjaardag() {

        const container =
            document.getElementById(
                "volgendeVerjaardag"
            );


        const verjaardagen =
            verjaardagsLijst();


        if (
            verjaardagen.length === 0
        ) {

            container.innerHTML = `

                <p>
                    Er zijn nog geen honden
                    met een geboortedatum.
                </p>

            `;

            return;
        }


        verjaardagen.forEach(
            function(item) {

                item.dagen =
                    dagenTot(
                        item.datum
                    );

            }
        );


        verjaardagen.sort(
            function(a, b) {

                return a.dagen - b.dagen;

            }
        );


        const volgende =
            verjaardagen[0];


        const naam =
            volgende.lid.naamHond ||
            "Onbekende hond";


        const lid =
            volgende.lid.naamLid ||
            "Onbekend lid";


        const dagen =
            volgende.dagen;


        let tekst;


        if (dagen === 0) {

            tekst =
                "🎉 Vandaag jarig!";

        } else if (dagen === 1) {

            tekst =
                "Morgen jarig!";

        } else {

            tekst =
                "Nog " +
                dagen +
                " dagen";

        }


        container.innerHTML = `

            <div class="volgende-kaart">

                <div class="volgende-naam">
                    🐕 ${escapeHtml(naam)}
                </div>

                <div class="volgende-datum">
                    👤 Lid: ${escapeHtml(lid)}
                </div>

                <div class="volgende-datum">
                    🎂 ${escapeHtml(
                        formatteerDatum(
                            volgende.lid.geboorteHond
                        )
                    )}
                </div>

                <div class="dagen">
                    ${escapeHtml(tekst)}
                </div>

            </div>

        `;
    }


    // =========================================
    // VERJAARDAGEN TONEN
    // =========================================

    function toonVerjaardagen() {

        const lijst =
            document.getElementById(
                "verjaardagenLijst"
            );


        const zoekterm =
            document.getElementById(
                "zoekveld"
            )
            .value
            .toLowerCase()
            .trim();


        const filter =
            document.getElementById(
                "filter"
            ).value;


        let verjaardagen =
            verjaardagsLijst();


        // Zoeken
        verjaardagen =
            verjaardagen.filter(
                function(item) {

                    const lid =
                        item.lid;


                    const naamLid =
                        String(
                            lid.naamLid || ""
                        ).toLowerCase();


                    const naamHond =
                        String(
                            lid.naamHond || ""
                        ).toLowerCase();


                    const ras =
                        String(
                            lid.rasHond || ""
                        ).toLowerCase();


                    return (
                        naamLid.includes(
                            zoekterm
                        )
                        ||
                        naamHond.includes(
                            zoekterm
                        )
                        ||
                        ras.includes(
                            zoekterm
                        )
                    );

                }
            );


        // Filter deze maand
        if (
            filter === "maand"
        ) {

            const maand =
                new Date().getMonth();


            verjaardagen =
                verjaardagen.filter(
                    function(item) {

                        return (
                            item.datum.getMonth() ===
                            maand
                        );

                    }
                );
        }


        // Filter komende 30 dagen
        if (
            filter === "30dagen"
        ) {

            verjaardagen =
                verjaardagen.filter(
                    function(item) {

                        const dagen =
                            dagenTot(
                                item.datum
                            );


                        return dagen <= 30;

                    }
                );
        }


        // Dagen berekenen
        verjaardagen.forEach(
            function(item) {

                item.dagen =
                    dagenTot(
                        item.datum
                    );

            }
        );


        // Sorteren op eerstvolgende
        verjaardagen.sort(
            function(a, b) {

                return a.dagen - b.dagen;

            }
        );


        // Resultaat
        document.getElementById(
            "resultaat"
        ).innerText =
            verjaardagen.length +
            " verjaardag" +
            (
                verjaardagen.length === 1
                ? ""
                : "en"
            );


        lijst.innerHTML = "";


        if (
            verjaardagen.length === 0
        ) {

            lijst.innerHTML = `

                <div class="geen-verjaardagen">

                    <div class="geen-icoon">
                        🎂
                    </div>

                    <strong>
                        Geen verjaardagen gevonden
                    </strong>

                    <p>
                        Voeg bij een lid een
                        geboortedatum van de hond toe
                        of pas je zoekfilter aan.
                    </p>

                </div>

            `;

            return;
        }


        // Kaarten maken
        verjaardagen.forEach(
            function(item) {

                const lid =
                    item.lid;


                const vandaag =
                    isVandaag(
                        item.datum
                    );


                const naamHond =
                    lid.naamHond ||
                    "Onbekende hond";


                const naamLid =
                    lid.naamLid ||
                    "Onbekend lid";


                const ras =
                    lid.rasHond ||
                    "Niet ingevuld";


                const leeftijd =
                    berekenLeeftijd(
                        lid.geboorteHond
                    );


                let afteltekst;


                if (vandaag) {

                    afteltekst =
                        "🎉 Vandaag jarig!";

                } else if (
                    item.dagen === 1
                ) {

                    afteltekst =
                        "🎈 Morgen jarig!";

                } else {

                    afteltekst =
                        "⏰ Nog " +
                        item.dagen +
                        " dagen";

                }


                const kaart =
                    document.createElement(
                        "div"
                    );


                kaart.className =
                    "verjaardag";


                if (vandaag) {

                    kaart.classList.add(
                        "vandaag-kaart"
                    );
                }


                kaart.innerHTML = `

                    <div class="verjaardag-kop">

                        <h3>
                            🐕 ${escapeHtml(
                                naamHond
                            )}
                        </h3>

                        <span
                            class="
                                datum-badge
                                ${vandaag
                                    ? "vandaag-badge"
                                    : ""}
                            ">

                            ${
                                vandaag
                                ? "🎉 Vandaag"
                                : escapeHtml(
                                    formatteerVerjaardag(
                                        item.datum
                                    )
                                )
                            }

                        </span>

                    </div>


                    <div class="gegevens">

                        <div class="gegeven">
                            <strong>👤 Lid:</strong>
                            ${escapeHtml(
                                naamLid
                            )}
                        </div>

                        <div class="gegeven">
                            <strong>🐾 Ras:</strong>
                            ${escapeHtml(
                                ras
                            )}
                        </div>

                        <div class="gegeven">
                            <strong>🎂 Geboren:</strong>
                            ${escapeHtml(
                                formatteerDatum(
                                    lid.geboorteHond
                                )
                            )}
                        </div>

                        <div class="gegeven">
                            <strong>🎈 Leeftijd:</strong>
                            ${escapeHtml(
                                leeftijd +
                                " jaar"
                            )}
                        </div>

                    </div>


                    <div
                        class="
                            aftellen
                            ${vandaag
                                ? "vandaag-tekst"
                                : ""}
                        ">

                        ${escapeHtml(
                            afteltekst
                        )}

                    </div>

                `;


                lijst.appendChild(
                    kaart
                );

            }
        );
    }


    // =========================================
    // DATUM FORMAATTEREN
    // =========================================

    function formatteerDatum(
        datum
    ) {

        if (!datum) {
            return "Niet ingevuld";
        }


        const delen =
            datum.split("-");


        if (
            delen.length !== 3
        ) {

            return datum;

        }


        return (
            delen[2] +
            "-" +
            delen[1] +
            "-" +
            delen[0]
        );
    }


    // =========================================
    // VERJAARDAGSDATUM FORMATTEREN
    // =========================================

    function formatteerVerjaardag(
        datum
    ) {

        const maanden = [

            "januari",
            "februari",
            "maart",
            "april",
            "mei",
            "juni",
            "juli",
            "augustus",
            "september",
            "oktober",
            "november",
            "december"

        ];


        return (
            datum.getDate() +
            " " +
            maanden[
                datum.getMonth()
            ]
        );
    }


    // =========================================
    // DATUM CONTROLEREN
    // =========================================

    function geldigeDatum(
        datum
    ) {

        if (!datum) {
            return false;
        }


        const waarde =
            new Date(
                datum + "T00:00:00"
            );


        return !isNaN(
            waarde.getTime()
        );
    }


    // =========================================
    // HTML VEILIG MAKEN
    // =========================================

    function escapeHtml(
        tekst
    ) {

        return String(
            tekst || ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
    }

</script>
